[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querylens"
version = "0.1.0"
description = "Analyze database query cost and recommend fixes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "QueryLens Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.16.0",
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pre-commit>=3.7.0",
    "pyrefly>=1.3.0",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "syrupy>=4.6.0",
]

[project.scripts]
querylens = "querylens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/querylens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
preview = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "DOC",  # pydoclint / docstring validation
    "S",    # flake8-bandit (security)
]
ignore = [
    "D100", # Missing docstring in public module (we allow module header docstrings when needed)
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__ (covered by class docstring)
    "S101", # Use of assert detected (needed for pytest and hypothesis)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "DOC", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/querylens"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
